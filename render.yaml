services:
  - type: web
    name: avelune-health-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
